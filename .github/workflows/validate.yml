name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - name: Check native ECDSA Fail harness
        run: cargo check --locked --bins
      - name: ECDLP package preflight
        run: node ./ecdlp.js preflight
