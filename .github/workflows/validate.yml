name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-21
        with:
          toolchain: 1.93.0
      - name: Check native ECDSA Fail harness
        run: cargo check --locked --bins
      - name: ECDLP package preflight
        run: node ./ecdlp.js preflight
      - name: Trusted-worker boundary tests
        run: node --test tools/trusted-worker.test.mjs
